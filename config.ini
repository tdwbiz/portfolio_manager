# Non-secret application settings for portfolio_manager.
# This file IS committed to git.
# Secrets (DB password, API keys) go in .env — never committed.

[import]
# Absolute paths to the inbox and processed folders.
# Leave blank to use <project_root>/inbox and <project_root>/processed.
inbox_dir =
processed_dir =

# Directory for rejection-log CSVs (one rotating file per month).
# Leave blank to use <project_root>/logs.
logs_dir =

# How often (seconds) the background watcher checks the inbox when runserver is running.
# Set to 0 to disable the automatic background watcher entirely.
poll_interval = 60

[ui]
# Pagination sizes
transactions_page_size = 50
account_detail_page_size = 50

[cache]
# Quote cache timeout used in the UI and API responses.
price_timeout_seconds = 900

# Historical chart cache timeout.
historical_price_timeout_seconds = 3600

[logging]
# Rotating file log settings.
file_max_bytes = 5242880
file_backup_count = 5
