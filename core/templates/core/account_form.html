{% extends "core/base.html" %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-bank"></i> {{ title }}</h1>
  <p>Add or edit an account</p>
</div>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Account</button>
</form>
<a href="{% url 'accounts_list' %}">Cancel</a>
{% endblock %}
