{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-bank"></i> {{ title }}</h1>
  <p class="text-muted">Add or edit an account</p>
</div>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Account</button>
</form>
<a href="{% url 'accounts_list' %}" class="btn btn-outline-secondary">Cancel</a>
{% endblock %}
