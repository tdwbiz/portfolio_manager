{% extends "core/base.html" %}

{% block title %}Sign In - {{ branding.company_name }}{% endblock %}

{% block content %}
{% load static %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-lg" style="margin-top: 50px;">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <img src="{% static 'core/img/tsmoney_icon.jpg' %}"
               alt="TS Money" class="login-logo">
          <h2 class="mb-1" style="color: var(--ts-navy); font-weight: 700;">TS Money</h2>
          <p class="text-muted small">invest like you mean it</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">
              <i class="bi bi-person"></i> Username
            </label>
            <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">
              <i class="bi bi-lock"></i> Password
            </label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
