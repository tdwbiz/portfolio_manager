[pytest]
# Pytest configuration for portfolio_manager E2E tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: Marks tests as slow (deselect with '-m "not slow"')
    smoke: Quick sanity checks
    authentication: User authentication tests
    navigation: Navigation and routing tests
    portfolio: Portfolio management tests
    import: PDF import tests
    responsive: Responsive design tests
    forms: Form validation tests
    workflows: User workflow tests
    security: Security feature tests
    performance: Performance metric tests
    api: API endpoint tests
    charts: Chart rendering tests
addopts = 
    -v
    --tb=short
    --strict-markers
    -x
    --disable-warnings
# Playwright configuration
asyncio_mode = auto
