{% extends "core/base.html" %}

{% block title %}Create Alternative Portfolio{% endblock %}

{% block content %}
<div class="container mt-4">
  <h4>Create Alternative Portfolio</h4>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label for="account_id" class="form-label">Account</label>
      <select class="form-select" id="account_id" name="account_id" required>
        <option value="">Select account...</option>
        {% for account in accounts %}
        <option value="{{ account.account_id }}">{{ account.account_id }} ({{ account.owner }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" name="name" value="New Alternative">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description" rows="2"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Create
    </button>
    <a href="{% url 'risk:alternatives_list' %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
